name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev,azure]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Verify deterministic OpenAPI contract
        run: python -m cognistore.api.openapi --check docs/openapi/v1.json

  observability:
    name: Prometheus rules and operational alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose, Prometheus configuration, and synthetic breach/recovery fixtures
        run: ./docker/observability/verify.sh

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      COGNISTORE_NATS_URL: nats://127.0.0.1:4222
      COGNISTORE_MINIO_ENDPOINT_URL: http://127.0.0.1:9000
      COGNISTORE_MINIO_ACCESS_KEY: minioadmin
      COGNISTORE_MINIO_SECRET_KEY: minioadmin
      COGNISTORE_MINIO_REGION: us-east-1
      COGNISTORE_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=cognistore;AccountKey=Y29nbmlzdG9yZS1henVyaXRlLWRldmVsb3BtZW50LW9ubHk=;BlobEndpoint=http://127.0.0.1:10000/cognistore;"
      COGNISTORE_TEST_POSTGRES_DSN: postgresql://cognistore:cognistore-test-only@127.0.0.1:55432/postgres
      COGNISTORE_REQUIRE_LIBMAGIC: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libmagic1

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev,azure]"

      - name: Record test runtime and configuration
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            python --version
            uname -a
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > test-results/runtime.txt
          python -m pip freeze > test-results/requirements.txt
          cp pyproject.toml test-results/pyproject.toml

      - name: Run unit and conformance tests
        run: |
          mkdir -p test-results
          python -m coverage erase
          python -m pytest tests/unit tests/conformance \
            --cov=cognistore \
            --cov-branch \
            --cov-report= \
            --junitxml=test-results/unit.xml

      - name: Start isolated integration services
        id: integration_services
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          docker build --target minio --tag cognistore-minio:qualification .
          docker run --detach --rm \
            --name cognistore-nats \
            --publish 4222:4222 \
            --publish 8222:8222 \
            nats:2.10.26-alpine@sha256:d69eb29526c1d98afdfb2e2434763bef77b5f3c83e2e24769c13a4d104be475e \
            -js -m 8222
          docker run --detach --rm \
            --name cognistore-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            cognistore-minio:qualification \
            server /data
          docker run --detach --rm \
            --name cognistore-postgres \
            --publish 55432:5432 \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_USER=cognistore \
            --env POSTGRES_PASSWORD=cognistore-test-only \
            pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b

          docker run --detach --rm \
            --name cognistore-azurite \
            --publish 127.0.0.1:10000:10000 \
            --env AZURITE_ACCOUNTS=cognistore:Y29nbmlzdG9yZS1henVyaXRlLWRldmVsb3BtZW50LW9ubHk= \
            mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --silent

          for _attempt in {1..30}; do
            if curl --fail --silent --show-error \
                "http://127.0.0.1:8222/healthz?js-enabled-only=true" >/dev/null \
              && curl --fail --silent --show-error \
                "http://127.0.0.1:9000/minio/health/live" >/dev/null \
              && docker exec cognistore-postgres \
                pg_isready -U cognistore -d postgres >/dev/null \
              && docker exec cognistore-azurite node -e \
                "const s = require('net').connect(10000, '127.0.0.1', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"; then
              exit 0
            fi
            sleep 1
          done

          echo "Integration services did not become healthy within 30 seconds."
          docker logs cognistore-nats || true
          docker logs cognistore-minio || true
          docker logs cognistore-postgres || true
          docker logs cognistore-azurite || true
          exit 1

      - name: Record integration service image identities
        if: ${{ !cancelled() && steps.integration_services.outcome == 'success' }}
        run: |
          docker inspect --format '{{.Name}} {{.Config.Image}} {{.Image}}' \
            cognistore-nats cognistore-minio cognistore-postgres cognistore-azurite \
            > test-results/service-images.txt

      - name: Run integration tests
        if: ${{ !cancelled() && steps.integration_services.outcome == 'success' }}
        run: |
          python -m pytest tests/integration \
            --cov=cognistore \
            --cov-branch \
            --cov-append \
            --cov-report= \
            --junitxml=test-results/integration.xml

      - name: Enforce coverage threshold
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          coverage_status=0
          python -m coverage report --show-missing || coverage_status=$?
          python -m coverage xml -o coverage.xml || coverage_status=$?
          exit "$coverage_status"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Show integration service logs after a failure
        if: ${{ failure() }}
        run: |
          docker logs --tail 200 cognistore-nats || true
          docker logs --tail 200 cognistore-minio || true
          docker logs --tail 200 cognistore-postgres || true
          docker logs --tail 200 cognistore-azurite || true

  gcs-emulator:
    name: GCS HTTP emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COGNISTORE_GCS_EMULATOR_ENDPOINT: http://127.0.0.1:4443
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Record test runtime and configuration
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            python --version
            uname -a
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > test-results/runtime.txt
          python -m pip freeze > test-results/requirements.txt
          cp pyproject.toml test-results/pyproject.toml

      - name: Build and start pinned GCS emulator
        run: |
          docker compose -f docker-compose.gcs.yml config > test-results/gcs-compose.yml
          docker compose -f docker-compose.gcs.yml up --detach --build
          docker image inspect --format '{{.Id}} {{json .RepoDigests}} {{.Os}}/{{.Architecture}}' \
            "$(docker compose -f docker-compose.gcs.yml images --quiet gcs)" \
            > test-results/gcs-image.txt
          for _attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4443/storage/v1/b" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.gcs.yml logs
          exit 1

      - name: Run GCS integration conformance
        # One precise strict xfail records the upstream media GET generation
        # precondition bug. The deterministic protocol suite and opt-in live
        # validation also exercise that condition without an expected failure.
        run: python -m pytest tests/integration/test_gcs.py --junitxml=test-results/gcs.xml

      - name: Upload GCS test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcs-emulator-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Show emulator logs after a failure
        if: ${{ failure() }}
        run: docker compose -f docker-compose.gcs.yml logs --tail 100

      - name: Stop GCS emulator
        if: ${{ always() }}
        run: docker compose -f docker-compose.gcs.yml down

  default-suite:
    name: Default full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COGNISTORE_REQUIRE_LIBMAGIC: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libmagic1

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev,azure]"

      - name: Record test runtime and configuration
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            python --version
            uname -a
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > test-results/runtime.txt
          python -m pip freeze > test-results/requirements.txt
          cp pyproject.toml test-results/pyproject.toml

      - name: Run documented default full-suite command
        env:
          # Preserve the documented command and pyproject's -rA skip/xfail output.
          PYTEST_ADDOPTS: --junitxml=test-results/default.xml
        run: python -m pytest

      - name: Upload default full-suite test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: default-full-suite-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build and install package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel installation from outside the checkout
        env:
          COGNISTORE_SECURITY_PROFILE: development
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/cognistore-smoke"
          "${RUNNER_TEMP}/cognistore-smoke/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cognistore-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/cognistore-smoke/bin/python" -c \
            'import cognistore; from importlib.metadata import version; print(version("cognistore"))'
          "${RUNNER_TEMP}/cognistore-smoke/bin/cognistore" --help >/dev/null
          "${RUNNER_TEMP}/cognistore-smoke/bin/cognistore-sample" verify >/dev/null
          "${RUNNER_TEMP}/cognistore-smoke/bin/python" - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import httpx

          from cognistore.db import MigrationManager, SQLCatalog
          from cognistore.sdk import AskRequest, CogniStoreClient
          from cognistore.sdk.examples.minimal_query import main as example_main
          from cognistore.samples.content_search import read_sample_corpus

          with TemporaryDirectory() as directory:
              with SQLCatalog(Path(directory) / "catalog.sqlite3") as catalog:
                  migrations = MigrationManager()
                  assert migrations.heads() == ("0014_legal_holds",)
                  assert migrations.is_at_head(catalog.engine)

          assert files("cognistore.sdk").joinpath("py.typed").is_file()
          assert files("cognistore.ui").joinpath("static").joinpath("index.html").is_file()
          sample_assets = files("cognistore.samples.content_search").joinpath("assets")
          assert sample_assets.joinpath("LICENSE").is_file()
          assert sample_assets.joinpath("THIRD_PARTY_NOTICES").is_file()
          assert len(read_sample_corpus().manifest.objects) == 4
          assert callable(example_main)

          def query_response(request: httpx.Request) -> httpx.Response:
              assert request.method == "POST"
              assert request.url.path == "/v1/ask"
              assert b'"text":"Which documents explain tiering?"' in request.content
              return httpx.Response(
                  200,
                  request=request,
                  headers={"X-Request-ID": "clean-wheel-sdk-smoke"},
                  json={
                      "schema_version": 1,
                      "mode": "metadata",
                      "active_signals": ["metadata"],
                      "results": [],
                      "providers": [],
                      "generation_status": "not_requested",
                      "answer": None,
                  },
              )

          transport = httpx.MockTransport(query_response)
          with httpx.Client(transport=transport) as http_client:
              with CogniStoreClient(
                  "https://cognistore.example.test",
                  http_client=http_client,
              ) as sdk:
                  result = sdk.ask(
                      AskRequest(text="Which documents explain tiering?")
                  )
          assert result.schema_version == 1
          assert result.results == []
          PY

      - name: Exercise clean operator installation, backup/restore, and repair
        run: |
          python scripts/operator_drills.py \
            --workspace "${RUNNER_TEMP}/cognistore-operator-drill" \
            --evidence "${RUNNER_TEMP}/operator-evidence/operator-drill.json"

      - name: Upload operator drill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-drill-evidence
          path: ${{ runner.temp }}/operator-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Container images and Compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: cognistore-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose --profile integration --profile sample config --quiet

      - name: Build stack images
        run: docker compose --profile integration build

      - name: Verify image isolation and non-root users
        shell: bash
        run: |
          docker run --rm --entrypoint python cognistore:runtime -c \
            'import os; assert os.getuid() != 0, "runtime image runs as root"'
          docker run --rm --entrypoint python cognistore:development -c \
            'import os; assert os.getuid() != 0, "development image runs as root"'
          docker run --rm --entrypoint python cognistore:runtime -c \
            'import importlib.util; assert importlib.util.find_spec("pytest") is None, "runtime image contains pytest"'
          docker run --rm --entrypoint python cognistore:development -c \
            'import importlib.util; assert importlib.util.find_spec("pytest") is not None, "development image does not contain pytest"'
          docker run --rm --entrypoint python cognistore:runtime -c \
            'from cognistore.core.indexer import Indexer; result = Indexer().index_bytes(b"plain text", filename="fixture.bin"); assert result.mime == "text/plain"; assert result.mime_detection.detector == "libmagic"'
          docker run --rm --entrypoint sh cognistore/nats:2.10.26 -c \
            'test "$(id -u)" -ne 0'
          docker run --rm --entrypoint sh cognistore/minio:2025-04-22 -c \
            'test "$(id -u)" -ne 0'

      - name: Verify development volume ownership
        run: |
          docker compose --profile development run --rm --no-deps development \
            sh -c 'test -w /var/lib/cognistore && test -w /test-results'

      - name: Run Compose integration profile
        run: |
          docker compose --profile integration up \
            --abort-on-container-exit \
            --exit-code-from integration-tests

      - name: Verify interrupted move diagnostics survive restart
        run: bash docker/verify_shutdown.sh

      - name: Run reduced move qualification
        run: |
          docker compose --profile development run --rm \
            -e COGNISTORE_QUALIFICATION_GIT_REVISION="${GITHUB_SHA}" \
            -e COGNISTORE_QUALIFICATION_GIT_DIRTY=false \
            -e CI \
            -e GITHUB_ACTIONS \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_SHA \
            -e RUNNER_OS \
            -e RUNNER_ARCH \
            development \
            python tests/perf/perf_async_put_get.py \
              --drivers docker/drivers.yaml \
              --catalog-db "/var/lib/cognistore/qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sqlite3" \
              --output /test-results/m1-move-qualification.json \
              --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --profile reduced \
              --object-count 12 \
              --size 0 \
              --size 257 \
              --size 4097 \
              --size 16385 \
              --path posix:hot:warm \
              --path s3:hot:object \
              --workers 4 \
              --faults standard \
              --max-attempts 3 \
              --retry-base-delay 0.05 \
              --retry-max-delay 0.05 \
              --lease-seconds 0.02 \
              --worker-termination-timeout 30

      - name: Export move qualification evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          qualification_output="test-results/m1-move-qualification.json"
          qualification_temporary="$(mktemp test-results/.m1-move-qualification.XXXXXX)"
          trap 'rm -f -- "${qualification_temporary}"' EXIT
          rm -f -- "${qualification_output}"
          docker compose --profile development run --rm --no-deps development \
            python -c \
              'from pathlib import Path; print(Path("/test-results/m1-move-qualification.json").read_text(), end="")' \
            > "${qualification_temporary}"
          test -s "${qualification_temporary}"
          mv -- "${qualification_temporary}" "${qualification_output}"
          trap - EXIT

      - name: Upload move qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-move-qualification
          path: test-results/m1-move-qualification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Show Compose logs after a failure
        if: ${{ failure() }}
        run: docker compose --profile integration logs --no-color || true

      - name: Tear down Compose services and volumes
        if: ${{ always() }}
        run: |
          docker compose --profile integration --profile development down \
            --volumes --remove-orphans

  security:
    name: Dependency and static security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and security tools
        run: python -m pip install --editable ".[dev,azure]"

      - name: Audit Python dependencies
        run: python -m pip_audit . --strict --desc --progress-spinner=off

      - name: Audit installed development dependencies
        run: python -m pip_audit --local --skip-editable --desc --progress-spinner=off

      - name: Scan Python source with Bandit
        run: python -m bandit -q -c pyproject.toml -r cognistore -ll -ii

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
