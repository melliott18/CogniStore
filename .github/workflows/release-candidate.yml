name: Release candidate assembly

on:
  workflow_dispatch:

# On 2026-09-30 the owner authorized hosted CI resumption once the repo is public.
# Dispatch only after publication and the documented same-revision prerequisites.
# Historical skipped gates remain unmet until fresh hosted evidence passes.

# Assembly retains workflow artifacts; it neither publishes packages
# nor deploys infrastructure. Reading prior hosted runs needs actions: read.
permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  assemble:
    name: Freeze and verify Linux amd64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require main for candidate dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Dispatch release candidate assembly from main.' >&2
            exit 1
          fi

      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up assembly driver Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Capture hosted gate evidence for this source revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["GITHUB_SHA"]
          server = os.environ["GITHUB_SERVER_URL"]
          api = os.environ["GITHUB_API_URL"]
          gates = []
          for workflow in ("ci.yml", "kubernetes.yml", "terraform.yml"):
              query = urllib.parse.urlencode({
                  "head_sha": source_sha, "branch": "main", "per_page": 100,
              })
              request = urllib.request.Request(
                  f"{api}/repos/{repository}/actions/workflows/{workflow}/runs?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              runs = [
                  run for run in payload["workflow_runs"]
                  if run["head_sha"] == source_sha
                  and run["head_branch"] == "main"
                  and run["event"] in ("push", "workflow_dispatch")
              ]
              gate = {
                  "workflow": workflow,
                  "required": True,
                  "status": "missing",
                  "scope": "source-revision; independently resolved hosted environments",
              }
              if runs:
                  run = max(runs, key=lambda item: (
                      item["updated_at"], item["id"], item["run_attempt"],
                  ))
                  gate.update({
                      "status": (
                          "passed" if run["conclusion"] == "success"
                          else "pending" if run["status"] != "completed"
                          else "failed"
                      ),
                      "run_id": run["id"],
                      "run_attempt": run["run_attempt"],
                      "url": run["html_url"],
                      "head_sha": run["head_sha"],
                      "event": run["event"],
                      "conclusion": run["conclusion"],
                      "updated_at": run["updated_at"],
                  })
              gates.append(gate)
          evidence = {
              "schema_version": 1,
              "source_sha": source_sha,
              "repository": repository,
              "qualification_claim": False,
              "workflow_run_url": (
                  f"{server}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  f"/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "status": (
                  "passed" if all(gate["status"] == "passed" for gate in gates) else
                  "blocked"
              ),
              "gates": gates,
          }
          destination = Path(os.environ["RUNNER_TEMP"]) / "release-evidence/hosted-ci.json"
          destination.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          for gate in gates:
              print(f"{gate['workflow']}: {gate['status']}")
          PY

      - name: Assemble exact candidate and verify its installed artifacts
        shell: bash
        run: |
          set -euo pipefail
          args=(
            build
            --output "$RUNNER_TEMP/release-candidate"
            --hosted-evidence "$RUNNER_TEMP/release-evidence/hosted-ci.json"
          )
          # This builds once, freezes runtime/build/test-tool wheelhouses, checks
          # the offline installed image and executes the two fixes' regression
          # suites against the same wheel and frozen runtime dependencies.
          python scripts/release_candidate.py "${args[@]}"

      - name: Enforce same-revision hosted gates for main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-evidence/hosted-ci.json"
          evidence = json.loads(path.read_text(encoding="utf-8"))
          if evidence["status"] != "passed":
              raise SystemExit(
                  "Hosted gates are missing, pending or failed for this exact main SHA. "
                  "Run CI, Kubernetes acceptance and Terraform reference on main, then "
                  "repeat assembly. The retained candidate remains unqualified."
              )
          PY

      - name: Retain candidate and sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-candidate/
            ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record the evidence boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo 'Candidate assembly retains an installable bundle and reports for 90 days.'
            echo 'A green assembly run does not authorize deployment or pilot entry.'
            echo 'Focused regressions and installed smoke use the frozen candidate.'
            echo 'The hosted matrix and infrastructure gates use their own resolved environments.'
            echo 'Owner acceptance, native security review and production configuration qualification remain required.'
            echo 'Download and preserve the bundle before artifact expiry; rebuilding creates new evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
