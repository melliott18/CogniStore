name: Terraform reference

# Required checks must report on every PR, including documentation-only changes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mocked production plan and Helm handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Terraform and Helm
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/terraform-tools"
          cd "$RUNNER_TEMP/terraform-tools"
          curl --fail --silent --show-error --location --output terraform.zip \
            https://releases.hashicorp.com/terraform/1.15.9/terraform_1.15.9_linux_amd64.zip
          echo '76edd0b22d2f27d3d2e097cd793209646f719cf60f02ff3af626b07361137da1  terraform.zip' | sha256sum --check
          unzip terraform.zip terraform
          curl --fail --silent --show-error --location --output helm.tar.gz \
            https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  helm.tar.gz' | sha256sum --check
          tar -xzf helm.tar.gz
          mv linux-amd64/helm helm
          echo "$RUNNER_TEMP/terraform-tools" >> "$GITHUB_PATH"

      # No AWS login, deployment permissions, backend or real provider requests.
      - name: Validate Terraform and render production Helm output
        run: ./scripts/terraform/verify.sh

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-reference
          path: test-results/terraform/
          if-no-files-found: warn
          retention-days: 14
