tiers:
  hot:
    driver: posix
    path: /tmp/cognistore/hot
    chunk_size: 8388608
  warm:
    driver: posix
    path: /tmp/cognistore/warm
    chunk_size: 8388608

  # Example S3-compatible tier. It remains commented out so the default
  # POSIX-only configuration works without credentials or a running service.
  # See docs/s3_driver.md for AWS S3 and MinIO variants.
  # object:
  #   driver: s3
  #   endpoint_url: http://127.0.0.1:9000
  #   region_name: us-east-1
  #   access_key_env: COGNISTORE_MINIO_ACCESS_KEY
  #   secret_key_env: COGNISTORE_MINIO_SECRET_KEY
  #   addressing_style: path
  #   auto_create_bucket: true
  #   chunk_size: 8388608
  #   list_page_size: 1000
  #   multipart_threshold: 8388608

# Optional policy-similarity runtime. This requires a PostgreSQL catalog with
# pgvector and uses only embeddings already indexed in the same model space.
# Keep API keys in the named environment variable, never in this file.
# embedding:
#   provider: openai-compatible
#   base_url: https://embeddings.example.com
#   api_key_env: COGNISTORE_EMBEDDING_API_KEY
#   model: text-embedding-model
#   deployment_version: release-2026-09-01
#   dimensions: 1536
#   request_dimensions: false
