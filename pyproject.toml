[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cognistore"
version = "0.1.0"
description = "AI-powered data lifecycle management across heterogeneous storage tiers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Mitchell Elliott" },
]
keywords = ["data-lifecycle", "storage", "tiering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "alembic>=1.17.1,<2",
  "boto3>=1.35.9",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "nats-py>=2.9,<3",
  "pydantic==2.13.5",
  "psycopg[binary]>=3.3,<4",
  "pypdf>=6.16.2,<7",
  "python-magic>=0.4.27,<0.5",
  "python-docx>=1.2,<1.3",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0.44,<3",
  "tantivy>=0.26,<0.27",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0,<7",
]
dev = [
  "bandit[toml]>=1.7.10",
  "boto3-stubs[s3]>=1.35.9",
  "build>=1.2.2",
  "coverage[toml]>=7.2",
  "linkify-it-py>=2.2,<3",
  "markdown-it-py>=4,<5",
  "mdit-py-plugins>=0.6,<0.7",
  "mypy>=1.11",
  "openapi-spec-validator>=0.7.2,<0.8",
  "pip-audit>=2.7.3",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "reportlab>=4.4,<5",
  "ruff>=0.6",
  "twine>=5.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
cognistore = "cognistore.cli.cognistore_cli:main"
cognistore-api = "cognistore.api.server:main"
cognistore-sample = "cognistore.samples.content_search.cli:main"

[project.urls]
Homepage = "https://github.com/melliott18/CogniStore"
Issues = "https://github.com/melliott18/CogniStore/issues"
Repository = "https://github.com/melliott18/CogniStore.git"

[tool.setuptools.packages.find]
include = ["cognistore*"]

[tool.setuptools.package-data]
"cognistore.db" = [
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
]
"cognistore.sdk" = ["py.typed"]
"cognistore.samples.content_search" = ["assets/*"]
"cognistore.ui" = ["static/*.css", "static/*.html", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["cognistore"]
check_untyped_defs = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
  "-vv",
  "-rA",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
testpaths = ["tests"]
# SDK deprecations require explicit pytest.warns contract tests; these filters
# suppress existing dependency warnings that would otherwise hide useful output.
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
  "integration: requires an explicitly configured external integration service",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["cognistore"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests"]
targets = ["cognistore"]
