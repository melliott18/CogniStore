name: cognistore

services:
  nats:
    image: cognistore/nats:2.10.26
    build:
      context: .
      dockerfile: Dockerfile
      target: nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${COGNISTORE_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${COGNISTORE_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    stop_grace_period: 30s

  minio:
    image: cognistore/minio:2025-04-22
    build:
      context: .
      dockerfile: Dockerfile
      target: minio
    command: ["server", "/data", "--console-address", ":9001"]
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${COGNISTORE_MINIO_ACCESS_KEY:-cognistore}
      MINIO_ROOT_PASSWORD: ${COGNISTORE_MINIO_SECRET_KEY:-cognistore-development-only}
    ports:
      - "127.0.0.1:${COGNISTORE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${COGNISTORE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    stop_grace_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    profiles: [azure, integration, development]
    user: "1000:1000"
    working_dir: /tmp
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Public emulator-only account. Never use this key with a cloud account.
    environment:
      AZURITE_ACCOUNTS: cognistore:Y29nbmlzdG9yZS1henVyaXRlLWRldmVsb3BtZW50LW9ubHk=
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /tmp/azurite
      - --silent
      - --skipApiVersionCheck
    ports:
      - "127.0.0.1:${COGNISTORE_AZURITE_PORT:-10000}:10000"
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s = require('net').connect(10000, '127.0.0.1', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: cognistore
      POSTGRES_USER: cognistore
      POSTGRES_PASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
    ports:
      - "127.0.0.1:${COGNISTORE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

  cognistore:
    image: cognistore:runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      COGNISTORE_SECURITY_PROFILE: development
      AWS_EC2_METADATA_DISABLED: "true"
      COGNISTORE_CATALOG_DB: postgresql://cognistore@postgres:5432/cognistore
      COGNISTORE_MINIO_ACCESS_KEY: ${COGNISTORE_MINIO_ACCESS_KEY:-cognistore}
      COGNISTORE_MINIO_SECRET_KEY: ${COGNISTORE_MINIO_SECRET_KEY:-cognistore-development-only}
      COGNISTORE_SCHEDULE_DB: /var/lib/cognistore/schedule.sqlite3
      COGNISTORE_LOG_FORMAT: ${COGNISTORE_LOG_FORMAT:-json}
      COGNISTORE_OTEL_ENABLED: ${COGNISTORE_OTEL_ENABLED:-false}
      COGNISTORE_OTEL_ENDPOINT: ${COGNISTORE_OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SERVICE_NAME: cognistore-worker
      PGPASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
    command:
      - --no-config
      - --drivers
      - /etc/cognistore/drivers.yaml
      - --nats-url
      - nats://nats:4222
      - worker
      - --health-host
      - 0.0.0.0
      - --health-port
      - "8081"
      - --shutdown-grace
      - "30"
      - --settlement-timeout
      - "5"
      - --tier-limits
      - /etc/cognistore/tier-limits.yaml
    ports:
      - "127.0.0.1:${COGNISTORE_HEALTH_PORT:-8081}:8081"
    volumes:
      - cognistore-data:/var/lib/cognistore
      - ./docker/drivers.yaml:/etc/cognistore/drivers.yaml:ro
      - type: bind
        source: ${COGNISTORE_TIER_LIMITS_FILE:-./docker/tier-limits.yaml}
        target: /etc/cognistore/tier-limits.yaml
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=2).read()",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # The worker drains for up to 30 seconds and then settles its current
    # delivery. Preserve extra time for the durable move checkpoint to flush.
    stop_grace_period: 45s

  sample-loader:
    image: cognistore:runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles:
      - sample
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COGNISTORE_SECURITY_PROFILE: development
      PGPASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
      PYTHONPYCACHEPREFIX: /tmp/cognistore-pycache
    entrypoint: ["cognistore-sample"]
    command:
      - load
      - --drivers
      - /etc/cognistore/sample-drivers.yaml
      - --catalog-db
      - postgresql://cognistore@postgres:5432/cognistore
      - --keyword-index
      - /var/lib/cognistore/sample-keyword
    volumes:
      - cognistore-data:/var/lib/cognistore
      - ./docker/sample-drivers.yaml:/etc/cognistore/sample-drivers.yaml:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: "no"

  sample-api:
    image: cognistore:runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles:
      - sample
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      sample-loader:
        condition: service_completed_successfully
    environment:
      COGNISTORE_SECURITY_PROFILE: development
      PGPASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
      PYTHONPYCACHEPREFIX: /tmp/cognistore-pycache
    entrypoint: ["cognistore-sample"]
    command:
      - serve
      - --drivers
      - /etc/cognistore/sample-drivers.yaml
      - --catalog-db
      - postgresql://cognistore@postgres:5432/cognistore
      - --keyword-index
      - /var/lib/cognistore/sample-keyword
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "127.0.0.1:${COGNISTORE_SAMPLE_API_PORT:-8080}:8080"
    volumes:
      - cognistore-data:/var/lib/cognistore
      - ./docker/sample-drivers.yaml:/etc/cognistore/sample-drivers.yaml:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  # Optional local API, metrics, dashboards, and trace viewer. The API shares
  # the worker's storage and queue; sample-api uses a separate sample corpus.
  api:
    image: cognistore:runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: [observability]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      cognistore:
        condition: service_healthy
    environment:
      COGNISTORE_SECURITY_PROFILE: development
      AWS_EC2_METADATA_DISABLED: "true"
      COGNISTORE_DRIVERS: /etc/cognistore/drivers.yaml
      COGNISTORE_CATALOG_DB: postgresql://cognistore@postgres:5432/cognistore
      COGNISTORE_NATS_URL: nats://nats:4222
      COGNISTORE_MINIO_ACCESS_KEY: ${COGNISTORE_MINIO_ACCESS_KEY:-cognistore}
      COGNISTORE_MINIO_SECRET_KEY: ${COGNISTORE_MINIO_SECRET_KEY:-cognistore-development-only}
      COGNISTORE_LOG_FORMAT: ${COGNISTORE_LOG_FORMAT:-json}
      COGNISTORE_OTEL_ENABLED: ${COGNISTORE_OTEL_ENABLED:-false}
      COGNISTORE_OTEL_ENDPOINT: ${COGNISTORE_OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SERVICE_NAME: cognistore-api
      PGPASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
    entrypoint: [cognistore-api]
    command: [--host, 0.0.0.0, --port, "8080"]
    ports:
      - "127.0.0.1:${COGNISTORE_API_PORT:-8082}:8080"
    volumes:
      - cognistore-data:/var/lib/cognistore
      - ./docker/drivers.yaml:/etc/cognistore/drivers.yaml:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
    ports:
      - "127.0.0.1:${COGNISTORE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: cognistore
      GF_SECURITY_ADMIN_PASSWORD: ${COGNISTORE_GRAFANA_PASSWORD:-cognistore-development-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:${COGNISTORE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    profiles: [observability]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${COGNISTORE_JAEGER_PORT:-16686}:16686"
      - "127.0.0.1:${COGNISTORE_OTLP_PORT:-4318}:4318"
    tmpfs:
      - /tmp:size=64m,mode=1777

  integration-tests:
    image: cognistore:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    profiles:
      - integration
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      azurite:
        condition: service_healthy
      cognistore:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      COGNISTORE_SECURITY_PROFILE: development
      AWS_EC2_METADATA_DISABLED: "true"
      COGNISTORE_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=cognistore;AccountKey=Y29nbmlzdG9yZS1henVyaXRlLWRldmVsb3BtZW50LW9ubHk=;BlobEndpoint=http://azurite:10000/cognistore;"
      COGNISTORE_NATS_URL: nats://nats:4222
      COGNISTORE_MINIO_ENDPOINT_URL: http://minio:9000
      COGNISTORE_MINIO_ACCESS_KEY: ${COGNISTORE_MINIO_ACCESS_KEY:-cognistore}
      COGNISTORE_MINIO_SECRET_KEY: ${COGNISTORE_MINIO_SECRET_KEY:-cognistore-development-only}
      COGNISTORE_MINIO_REGION: us-east-1
      COGNISTORE_TEST_POSTGRES_DSN: postgresql://cognistore@postgres:5432/postgres
      PGPASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
      PYTHONPYCACHEPREFIX: /tmp/cognistore-pycache
    command:
      - python
      - -m
      - pytest
      - -p
      - no:cacheprovider
      - tests/integration
      - --junitxml=/test-results/integration.xml
    volumes:
      - test-results:/test-results
    tmpfs:
      - /tmp:size=512m,mode=1777

  development:
    image: cognistore:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    profiles:
      - development
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      azurite:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      COGNISTORE_SECURITY_PROFILE: development
      AWS_EC2_METADATA_DISABLED: "true"
      COGNISTORE_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=cognistore;AccountKey=Y29nbmlzdG9yZS1henVyaXRlLWRldmVsb3BtZW50LW9ubHk=;BlobEndpoint=http://azurite:10000/cognistore;"
      COGNISTORE_NATS_URL: nats://nats:4222
      COGNISTORE_MINIO_ENDPOINT_URL: http://minio:9000
      COGNISTORE_MINIO_ACCESS_KEY: ${COGNISTORE_MINIO_ACCESS_KEY:-cognistore}
      COGNISTORE_MINIO_SECRET_KEY: ${COGNISTORE_MINIO_SECRET_KEY:-cognistore-development-only}
      COGNISTORE_MINIO_REGION: us-east-1
      COGNISTORE_TEST_POSTGRES_DSN: postgresql://cognistore@postgres:5432/postgres
      PGPASSWORD: ${COGNISTORE_POSTGRES_PASSWORD:-cognistore-development-only}
      PYTHONPYCACHEPREFIX: /tmp/cognistore-pycache
    command: ["bash"]
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - cognistore-data:/var/lib/cognistore
      - test-results:/test-results
      - ./docker/drivers.yaml:/etc/cognistore/drivers.yaml:ro
    tmpfs:
      - /tmp:size=512m,mode=1777

volumes:
  cognistore-data:
  minio-data:
  nats-data:
  postgres-data:
  test-results:
  prometheus-data:
  grafana-data:
