global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cognistore-worker
    metrics_path: /metrics
    static_configs:
      - targets: [cognistore:8081]
  - job_name: cognistore-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
