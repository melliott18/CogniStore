      NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN 0.2x80
  - series: cognistore_policy_budget_unknown{dimension="carbon",instance="api-healthy"}
