    exp_alerts: []
  promql_expr_test:
  - expr: cognistore:queue_pending
    eval_time: 20m
    exp_samples:
    - labels: cognistore:queue_pending
      value: 4000
- name: Unknown budget accounting on one API replica cannot be hidden by another finite ratio
