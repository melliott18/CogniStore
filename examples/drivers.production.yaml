# Copy and adapt endpoints, secret names, and resource identities for deployment.
# Use native workload identity whenever the storage service supports it.
# This example contains references only; inject the Vault token file at runtime.
secrets:
  cache_ttl_seconds: 300
  providers:
    vault:
      type: vault_kv
      url: https://vault.example.com
      token_file: /run/secrets/vault-token
      mount: secret
    aws:
      type: aws_secrets_manager
      region_name: us-east-1

tiers:
  hot:
    driver: posix
    path: /var/lib/cognistore/hot

  # Store access_key and secret_key in the same Vault KV v2 record so one
  # fetched version supplies the complete credential pair.
  object:
    driver: s3
    endpoint_url: https://objects.example.com
    region_name: us-east-1
    access_key_ref:
      provider: vault
      name: cognistore/storage
      field: access_key
    secret_key_ref:
      provider: vault
      name: cognistore/storage
      field: secret_key
    addressing_style: path
    auto_create_bucket: false

  # AWS S3 uses the process's standard AWS credential chain / workload role.
  archive:
    driver: s3
    region_name: us-east-1
    auto_create_bucket: false

  # Azure uses DefaultAzureCredential; install cognistore[azure].
  azure:
    driver: azure_blob
    account_url: https://example.blob.core.windows.net
    auto_create_container: false

  # Google Cloud Storage uses Application Default Credentials / workload identity.
  cloud:
    driver: gcs
    project: example-project
    auto_create_bucket: false

  # For services without native identity, alternative reference forms are:
  # azure_shared:
  #   driver: azure_blob
  #   connection_string_ref:
  #     provider: aws
  #     name: cognistore/azure
  #     field: connection_string
  #   auto_create_container: false
  # gcs_service_account:
  #   driver: gcs
  #   project: example-project
  #   credentials_ref:
  #     provider: aws
  #     name: cognistore/gcs-service-account
  #   auto_create_bucket: false
