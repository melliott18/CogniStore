# Supply a tested immutable image tag or digest and pre-existing runtime Secrets.
nameOverride: ""
fullnameOverride: ""
image:
  repository: cognistore
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
securityProfile: production
config:
  existingSecret: ""
  # Bump after rotating an externally managed Secret to roll the pods.
  revision: "1"
credentials:
  existingSecret: ""
tls:
  existingSecret: ""
auth:
  issuer: ""
  audience: ""
  jwksUri: ""
serviceAccount:
  annotations: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
queue:
  stream: COGNISTORE_JOBS
  subject: cognistore.jobs
  consumer: cognistore-workers
api:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    # Requires a custom.metrics.k8s.io adapter; see docs/kubernetes.md.
    metrics:
      - type: Pods
        pods:
          metric: {name: cognistore_http_requests_per_second}
          target: {type: AverageValue, averageValue: "20"}
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies: [{type: Percent, value: 25, periodSeconds: 60}]
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{type: Percent, value: 100, periodSeconds: 60}]
  pdb:
    enabled: true
    maxUnavailable: 1
worker:
  replicas: 1
  maxInFlight: 8
  shutdownGrace: 30
  settlementTimeout: 5
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 8
    pollingInterval: 15
    cooldownPeriod: 300
    lagThreshold: "8"
    natsMonitoringEndpoint: ""
    account: "$G"
    useHttps: true
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies: [{type: Pods, value: 1, periodSeconds: 60}]
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{type: Pods, value: 2, periodSeconds: 30}]
scheduler:
  enabled: false
  readinessMaxAge: 30
  livenessMaxAge: 300
  # All scheduled-job workers share this RWO block volume on ONE node.
  storage:
    existingClaim: ""
    className: ""
    size: 2Gi
  principalIssuer: ""
  principalSubject: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
migration:
  enabled: true
  activeDeadlineSeconds: 300
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
networkPolicy:
  enabled: true
  # No ingress or data egress is granted by default. Kubelet probes still work.
  # Each item is a complete networking.k8s.io/v1 ingress/egress rule.
  ingress: []
  egress: []
  dns:
    enabled: true
    namespaceLabels: {kubernetes.io/metadata.name: kube-system}
    podLabels: {k8s-app: kube-dns}
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: ""
