prometheus:
  url: http://acceptance-prometheus.cognistore-acceptance.svc
  port: 9090
metricsRelistInterval: 10s
rules:
  default: false
  custom:
    - seriesQuery: 'cognistore_http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: namespace}
          pod: {resource: pod}
      name:
        matches: ^cognistore_http_requests_total$
        as: cognistore_http_requests_per_second
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>,route!~"/healthz|/readyz|/metrics"}[1m])) by (<<.GroupBy>>)'
