# Source: cognistore/templates/autoscaling.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cognistore-api
  labels:
    app.kubernetes.io/name: cognistore
    app.kubernetes.io/instance: cognistore
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "cognistore-0.1.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cognistore-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Percent
        value: 25
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 60
        type: Percent
        value: 100
      stabilizationWindowSeconds: 0
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 70
          type: Utilization
      type: Resource
