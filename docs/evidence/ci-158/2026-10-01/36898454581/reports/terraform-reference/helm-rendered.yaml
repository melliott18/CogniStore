            - name: AWS_ROLE_ARN
              value: arn:aws:iam::111122223333:role/cognistore-test-workload
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/cognistore-aws/token
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            - name: OTEL_SERVICE_NAME
